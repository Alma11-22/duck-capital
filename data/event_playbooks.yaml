# Duck Capital event playbooks.
# For each kind of event: how to spot it in headlines, who got hurt and who
# benefited last time, and the signal that the trade is over.
# Edit freely: add tickers, add events. "direct" winners benefit first-hand;
# "second_order" winners benefit one step removed (the less obvious plays).

pandemic:
  label: Pandemic / health emergency
  keywords: [pandemic, outbreak, lockdown, quarantine, virus spreads, new variant, who declares, stay-at-home, covid]
  past: COVID-19, Feb–Mar 2020
  losers: [DAL, UAL, AAL, CCL, RCL, NCLH, MAR, HLT, BKNG, EXPE, ABNB, LYV]
  winners:
    direct: [ZM, MRNA, PFE, TDOC, AMZN, CLX, DOCU, ABT]
    second_order: [PTON, NFLX, DASH, SHOP, ETSY, LOGI, HD, CHWY]
  sell_when: Reopening is in sight - vaccine approved, lockdowns lifting, travel bookings recovering.

war:
  label: War / geopolitical conflict
  keywords: [invasion, invades, missile strike, missiles, airstrike, air strike, drone attack, troops, military escalation, nato, ceasefire collapses, conflict escalates, declares war, war with, war in]
  past: Russia invades Ukraine, Feb 2022
  losers: [DAL, UAL, CCL, BKNG, MAR]
  winners:
    direct: [LMT, NOC, RTX, GD, LHX, XOM, CVX, OXY]
    second_order: [CF, MOS, NTR, LNG, PANW, CRWD, NEM, AEM]
  sell_when: Ceasefire talks gain traction, or oil falls back to pre-war levels.

tariffs:
  label: Tariffs / trade war
  keywords: [tariff, tariffs, trade war, retaliatory, import duties, export controls, export curbs, chip curbs, de minimis, trade deal collapses, trade talks stall, duties on]
  past: Liberation Day tariffs, Apr 2025
  losers: [AAPL, NKE, GM, F, STLA, TGT, BBY, DECK, VFC, AMZN, TSM]
  winners:
    direct: [NUE, STLD, CLF, WMT, COST]
    second_order: [TJX, ROST, BURL, DG, ROK]
  sell_when: A deal or pause is announced, or tariffs are rolled back.

rate_shock:
  label: Rate shock / inflation scare
  keywords: [rate hike, hawkish, inflation surges, inflation jumps, hotter-than-expected, hotter than expected, cpi jumps, cpi rises, yields soar, yields jump, yields surge, yields climb, yields spike, yield hits, yields hit, 10-year yield, 30-year yield, treasury selloff, bond selloff, bond rout, fed signals, fewer rate cuts, no rate cut, rate cut hopes fade, sticky inflation]
  past: Fed hiking cycle, 2022
  losers: [SHOP, ROKU, DHI, LEN, O, TTD, SNOW]
  winners:
    direct: [JPM, BAC, PGR, SCHW]
    second_order: [BRK.B, XOM, CVX, CB]
  sell_when: The Fed signals a pause or cuts, or inflation cools for two straight reports.

bank_crisis:
  label: Bank scare / credit crisis
  keywords: [bank run, deposit outflows, bank failure, seized by regulators, fdic, liquidity crisis, bank collapse, contagion, credit crunch, private credit, loan losses, bank stocks tumble, regional banks]
  past: Silicon Valley Bank collapse, Mar 2023
  losers: [ZION, WAL, KEY, CMA, FLG, SCHW]
  winners:
    direct: [JPM, NEM, AEM]
    second_order: [COIN, GOLD, V, MA]
  sell_when: A government backstop is announced and deposit flows stabilize.

ai_breakthrough:
  label: AI breakthrough
  keywords: [new ai model, launches gpt, chatgpt, deepseek, reasoning model, ai agent, agi, frontier model, breakthrough model]
  past: ChatGPT launch Nov 2022; DeepSeek Jan 2025
  losers: [CHGG, IT, ACN, EPAM, ADBE, CRM, GETY, CNXC, TEAM, HUBS]
  winners:
    direct: [NVDA, MSFT, AVGO, AMD, TSM]
    second_order: [VRT, CEG, VST, ANET, MU, EQIX, DLR]
  sell_when: Big tech cuts AI spending guidance, or a cheaper-AI shock (like DeepSeek) hits chip demand.

energy_shock:
  label: Oil / energy shock
  keywords: [oil prices surge, oil surges, oil jumps, oil spikes, crude spikes, crude surges, brent tops, opec cut, supply disruption, strait of hormuz, refinery outage, energy crisis, gas prices soar, natural gas surges]
  past: Oil spike, Mar–Jun 2022
  losers: [DAL, UAL, AAL, FDX, UPS, DOW]
  winners:
    direct: [XOM, CVX, COP, OXY, VLO, MPC]
    second_order: [TSLA, FSLR, ENPH, LNG]
  sell_when: Oil falls back, OPEC raises output, or emergency reserves are released.

disaster:
  label: Natural disaster
  keywords: [hurricane, earthquake, wildfire, landfall, flooding, tornado outbreak]
  past: Hurricane Ian, Sep 2022
  losers: [TRV, ALL, PGR, PCG]
  winners:
    direct: [HD, LOW, GNRC]
    second_order: [CPRT, BLDR, SHW]
  sell_when: Rebuild spending normalizes, usually within 1–2 quarters.

cyber:
  label: Major cyberattack / outage
  keywords: [cyberattack, ransomware, data breach, hackers, global outage, cyber attack, hacked, systems outage]
  past: CrowdStrike outage Jul 2024; SolarWinds hack Dec 2020
  losers: []
  winners:
    direct: [CRWD, PANW, ZS, FTNT, S]
    second_order: [OKTA, NET, CYBR]
  sell_when: The news cycle passes - usually weeks, not months.

ai_unwind:
  label: AI trade unwind / chip selloff
  keywords: [chip stocks fall, chip stocks slide, chip stocks tumble, chipmakers slide, chipmakers fall, semiconductor selloff, semiconductor stocks, ai bubble, ai trade, ai stocks fall, ai stocks slide, ai spending fears, capex fears, nvidia falls, nvidia sinks, nvidia slides, bearish chip, data center delays, tech selloff, nasdaq slides, nasdaq falls]
  past: DeepSeek shock Jan 2025; chip selloff Jul–Aug 2024
  losers: [NVDA, AMD, AVGO, MU, SMCI, VRT, ANET, TSM, CRWV, NBIS]
  winners:
    direct: [WMT, COST, PG, KO, JNJ, BRK.B]
    second_order: [UNH, MCD, PEP, DUK, SO, GLD]
  sell_when: Big tech reaffirms AI spending, or chip stocks put in two weeks of higher lows.

crypto_crash:
  label: Crypto crash
  keywords: [bitcoin falls, bitcoin slides, bitcoin tumbles, bitcoin plunges, bitcoin crashes, bitcoin drops, bitcoin sinks, crypto selloff, crypto crash, crypto stocks, ether falls, liquidations, bitcoin below]
  past: FTX collapse Nov 2022; crypto winter 2022
  losers: [COIN, MSTR, HOOD, MARA, RIOT, CLSK, IBIT]
  winners:
    direct: [GLD, NEM, AEM]
    second_order: [CME, ICE, V, MA]
  sell_when: Bitcoin reclaims its 50-day average and fund outflows stop.
